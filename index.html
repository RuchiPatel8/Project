<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yellow Owl - Menu</title>
  <style>
    :root {
      --primary-color: #FFD700; /* Bright Yellow */
      --accent-color: #FFD700;  /* Bright Yellow */
      --background-color: #fff8f0;
      --text-color: #333;
      --card-background: #ffffff;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --border-color: #ccc;
      --heading-color: #FFA500;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--background-color);
      color: var(--text-color);
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    .menu {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: var(--card-background);
      border-radius: 10px;
      box-shadow: 0 2px 10px var(--shadow-color);
    }

    .menu h2 {
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      margin-top: 30px;
      color: var(--heading-color);
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dotted var(--border-color);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: var(--accent-color);
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Yellow Owl</h1>
    <p>Our Tasty Menu</p>
  </header>

  <section class="menu">
    <h2>Starters</h2>
    <div class="item">
      <span>Garlic Bread</span><span>200 rupees</span>
    </div>
    <div class="item">
      <span>Tomato Soup</span><span>150 rupees</span>
    </div>

    <h2>Main Course</h2>
    <div class="item">
      <span>Grilled Chicken</span><span>250 rupees</span>
    </div>
    <div class="item">
      <span>Veggie Pasta</span><span>215 rupees</span>
    </div>

    <h2>Desserts</h2>
    <div class="item">
      <span>Chocolate Cake</span><span>300 rupees</span>
    </div>
    <div class="item">
      <span>Chocolate Ice Cream</span><span>200 rupees</span>
    </div>
  </section>

  <footer>
    <p>© 2025 Yellow Owl</p>
  </footer>
</body>
</html>
